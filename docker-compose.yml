services:
  searxng:
    image: searxng/searxng:latest
    container_name: searchx-engine
    restart: unless-stopped
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=https://YOUR-DOMAIN/
    networks: [searchx]
  web:
    image: nginx:alpine
    container_name: searchx-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [searxng]
    networks: [searchx]
networks:
  searchx:
    driver: bridge
