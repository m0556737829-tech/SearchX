<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090d18"><meta name="description" content="SearchX — חיפוש חכם ברחבי האינטרנט">
<title>SearchX — חיפוש בכל הרשת</title>
<style>
:root{color-scheme:dark;--bg:#090d18;--panel:#111827;--panel2:#151f31;--line:#26344b;--muted:#93a4bd;--text:#edf3ff;--blue:#6ea8ff;--cyan:#53dfd0}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#1d3760 0,transparent 48%),var(--bg);color:var(--text);font-family:Arial,"Noto Sans Hebrew",sans-serif;min-height:100vh}
header{max-width:1080px;margin:auto;padding:26px 22px 10px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:12px;align-items:center;font-weight:800;font-size:22px;letter-spacing:.2px}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#70a9ff,#48dfd1);display:grid;place-items:center;color:#07101d;font-size:24px;font-weight:900;box-shadow:0 8px 30px #53aaff35}.status{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:30px;padding:8px 12px}
main{max-width:920px;margin:6vh auto 70px;padding:0 22px}.hero{text-align:center;margin-bottom:28px}.hero h1{font-size:clamp(34px,6vw,54px);margin:0 0 12px;letter-spacing:-1.5px}.hero h1 span{background:linear-gradient(90deg,#77aaff,#54e0d0);-webkit-background-clip:text;background-clip:text;color:transparent}.hero p{margin:0;color:var(--muted);font-size:15px}
.searchbox{display:flex;gap:10px;background:#111b2c;border:1px solid #334764;border-radius:18px;padding:9px;box-shadow:0 20px 65px #0005;transition:.2s}.searchbox:focus-within{border-color:#6ea8ff;box-shadow:0 0 0 4px #6ea8ff18,0 20px 65px #0005}.searchbox input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font-size:17px;padding:12px 14px}.searchbox input::placeholder{color:#71829d}.searchbox button{border:0;border-radius:12px;background:linear-gradient(135deg,#77aaff,#52d9ce);color:#07111e;font-weight:800;font-size:15px;padding:0 26px;cursor:pointer}.searchbox button:disabled{opacity:.6;cursor:wait}
.filters{display:flex;justify-content:center;gap:8px;margin:17px 0 30px;flex-wrap:wrap}.filter{border:1px solid var(--line);background:#111827;color:#aebbd0;padding:9px 17px;border-radius:30px;cursor:pointer;font-size:13px}.filter.active{background:#1b3557;border-color:#527fb8;color:#fff}
#message{text-align:center;color:var(--muted);padding:22px 10px;font-size:14px}#results{display:grid;gap:13px}.result{background:linear-gradient(135deg,#121d2d,#101827);border:1px solid #24334a;border-radius:15px;padding:18px 20px;transition:.18s}.result:hover{border-color:#496b99;transform:translateY(-1px)}.result a.title{display:block;color:#8dbaff;font-size:18px;font-weight:700;text-decoration:none;margin-bottom:8px;line-height:1.45}.result a.title:hover{text-decoration:underline}.url{direction:ltr;text-align:right;color:#64cbbf;font-size:12px;overflow-wrap:anywhere;margin-bottom:9px}.snippet{color:#bdc9da;font-size:14px;line-height:1.7}.meta{margin-top:10px;color:#74859f;font-size:11px}.thumb{max-width:120px;max-height:90px;object-fit:cover;float:left;border-radius:9px;margin:0 12px 8px 0}.pager{display:flex;justify-content:center;gap:12px;margin:24px}.pager button,.secondary{background:#18263a;color:#dce8fb;border:1px solid #344b6b;border-radius:10px;padding:10px 18px;cursor:pointer}.pager button:disabled{opacity:.35;cursor:not-allowed}.foot{text-align:center;color:#61718b;font-size:11px;margin-top:50px}.history{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:14px}.history button{background:transparent;border:1px solid #26344b;color:#8294af;border-radius:30px;padding:6px 11px;cursor:pointer;font-size:12px}
@media(max-width:560px){header{padding:18px 16px}.status{display:none}main{margin-top:5vh;padding:0 14px}.searchbox{gap:4px}.searchbox input{font-size:15px;padding:10px}.searchbox button{padding:0 16px}.result{padding:15px}.result a.title{font-size:16px}}
</style></head>
<body>
<header><div class="brand"><div class="logo">⌕</div>SearchX</div><div class="status">חיפוש מטא־מנוע · תוצאות במקום אחד</div></header>
<main>
<section class="hero"><h1>כל הרשת. <span>חיפוש אחד.</span></h1><p>מחפשים במקורות שונים ומציגים את התוצאות כאן, בלי לעבור לעמוד החיפוש שלהם.</p></section>
<form class="searchbox" id="form"><input id="q" type="search" placeholder="מה תרצה למצוא היום?" autocomplete="off" required><button id="submit" type="submit">חיפוש ←</button></form>
<nav class="filters" aria-label="סוג תוצאות"><button class="filter active" data-cat="general">הכול</button><button class="filter" data-cat="images">תמונות</button><button class="filter" data-cat="news">חדשות</button></nav>
<div class="history" id="history"></div><div id="message">הקלד מילת חיפוש כדי להתחיל.</div><section id="results"></section><div class="pager" id="pager" hidden><button id="prev">הקודם</button><span id="page"></span><button id="next">הבא</button></div>
<div class="foot">SearchX · תוצאות ממקורות חיפוש חיצוניים · לא קשור ל-Google</div>
</main>
<script>
const $=s=>document.querySelector(s);let category="general",page=1,lastQuery="",busy=false;
const form=$("#form"),q=$("#q"),results=$("#results"),message=$("#message"),submit=$("#submit"),pager=$("#pager");
function safeUrl(raw){try{const u=new URL(raw);return ["http:","https:"].includes(u.protocol)?u.href:"#"}catch{return "#"}}
function host(raw){try{return new URL(raw).hostname}catch{return raw||""}}
function escapeHtml(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(items){results.innerHTML="";if(!items.length){message.textContent="לא נמצאו תוצאות. נסה ניסוח אחר.";return}
message.textContent="נמצאו "+items.length+" תוצאות בעמוד זה";items.forEach(item=>{const a=safeUrl(item.url);const card=document.createElement("article");card.className="result";const img=item.img_src&&category==="images"?'<img class="thumb" loading="lazy" src="'+escapeHtml(safeUrl(item.img_src))+'" alt="">':"";card.innerHTML=img+'<a class="title" target="_blank" rel="noopener noreferrer" href="'+escapeHtml(a)+'">'+escapeHtml(item.title||"תוצאה ללא כותרת")+'</a><div class="url">'+escapeHtml(host(a))+'</div><div class="snippet">'+escapeHtml(item.content||item.description||"")+'</div><div class="meta">'+escapeHtml((item.engine||"מקור חיפוש"))+'</div>';results.appendChild(card)})}
async function search(){const query=q.value.trim();if(!query||busy)return;busy=true;lastQuery=query;submit.disabled=true;submit.textContent="מחפש…";results.innerHTML="";pager.hidden=true;message.textContent="מחפש במקורות שונים…";try{const url="https://a71bc99b-searchx.m0556737829.workers.dev/api/search?q="+encodeURIComponent(query)+"&format=json&pageno="+page+"&categories="+category+"&language=he";const response=await fetch(url,{headers:{Accept:"application/json"}});if(!response.ok)throw new Error("שגיאת שרת ("+response.status+")");const data=await response.json();render(data.results||[]);pager.hidden=false;$("#page").textContent="עמוד "+page;$("#prev").disabled=page<=1;$("#next").disabled=!(data.results||[]).length||data.results.length<10;saveHistory(query)}catch(e){message.textContent="לא ניתן לקבל תוצאות כרגע: "+e.message+". בדוק שהשרת פועל ושהחיבור לאינטרנט זמין."}finally{busy=false;submit.disabled=false;submit.textContent="חיפוש ←"}}
function saveHistory(query){let h=[];try{h=JSON.parse(localStorage.getItem("sx-history")||"[]")}catch{}h=[query,...h.filter(x=>x!==query)].slice(0,5);localStorage.setItem("sx-history",JSON.stringify(h));showHistory()}
function showHistory(){let h=[];try{h=JSON.parse(localStorage.getItem("sx-history")||"[]")}catch{}$("#history").innerHTML=h.map(x=>'<button type="button">'+escapeHtml(x)+'</button>').join("");$("#history").querySelectorAll("button").forEach(b=>b.onclick=()=>{q.value=b.textContent;page=1;search()})}
form.addEventListener("submit",e=>{e.preventDefault();page=1;search()});
document.querySelectorAll(".filter").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));b.classList.add("active");category=b.dataset.cat;if(lastQuery){page=1;search()}}));
$("#prev").onclick=()=>{if(page>1){page--;search()}};$("#next").onclick=()=>{page++;search()};showHistory();
</script></body></html>
