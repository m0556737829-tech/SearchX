use_default_settings: true

general:
  debug: false
  instance_name: "SearchX"

search:
  safe_search: 1
  default_lang: "he"
  formats:
    - html
    - json

server:
  # Set a unique long random secret in the deployment environment.
  secret_key: "REPLACE-WITH-A-LONG-RANDOM-SECRET"
  limiter: false
  image_proxy: true

ui:
  default_locale: "he"
  query_in_title: true
